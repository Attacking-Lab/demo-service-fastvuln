name: fastvuln

services:
  service:
    build: .
    ports:
      - "${SERVICE_PORT:-9000}:${SERVICE_PORT:-9000}"
    environment:
      - SERVICE_PORT=${SERVICE_PORT:-9000}
      - MONGO_ENABLED=1
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=mongodb
      - MONGO_PASSWORD=mongodb
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${SERVICE_PORT:-9000}/openapi.json')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  mongodb:
    image: mongo
    volumes:
      - mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mongodb:

networks:
  default:
    name: fastvuln
